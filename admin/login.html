<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Mendorbit</title>
  <link rel="icon" type="image/png" href="../assets/images/logo/logo.png?v=1.1.0">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              blue: '#1e3a8a',
              orange: '#f97316',
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/admin.css?v=1.2.7">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

  <!-- Background Ambient Glows -->
  <div class="absolute -top-32 -left-32 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-orange-600/20 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Login Card -->
  <div class="w-full max-w-md bg-slate-900/90 border border-slate-800 rounded-3xl p-8 sm:p-10 shadow-2xl backdrop-blur-xl relative z-10">
    
    <!-- Header with Logo -->
    <div class="text-center space-y-3 mb-8">
      <div class="inline-flex p-3 rounded-2xl bg-slate-800/80 border border-slate-700/80 shadow-inner">
        <img src="../assets/images/logo/logo.png?v=1.1.0" alt="Mendorbit Logo" class="w-12 h-12 object-contain drop-shadow">
      </div>
      <div>
        <h1 class="text-2xl font-black text-white tracking-tight">Admin Console</h1>
        <p class="text-xs text-slate-400 font-medium mt-1">Mendorbit Official Administration & Management</p>
      </div>
    </div>

    <!-- Alert / Error Notice -->
    <div id="login-alert" class="hidden mb-6 p-4 rounded-2xl bg-rose-500/15 border border-rose-500/30 text-rose-300 text-xs font-semibold flex items-start gap-2.5">
      <i data-lucide="alert-circle" class="w-4 h-4 text-rose-400 flex-shrink-0 mt-0.5"></i>
      <span id="login-alert-text">Invalid credentials.</span>
    </div>

    <!-- Login Form -->
    <form id="admin-login-form" class="space-y-5">
      
      <div>
        <label for="admin-username" class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-2">Username / Admin ID</label>
        <div class="relative">
          <i data-lucide="user" class="w-4 h-4 text-slate-500 absolute left-4 top-3.5"></i>
          <input type="text" id="admin-username" required placeholder="admin" autocomplete="username"
            class="w-full bg-slate-800/80 border border-slate-700 rounded-xl pl-11 pr-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition">
        </div>
      </div>

      <div>
        <label for="admin-password" class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-2">Security Password</label>
        <div class="relative">
          <i data-lucide="lock" class="w-4 h-4 text-slate-500 absolute left-4 top-3.5"></i>
          <input type="password" id="admin-password" required placeholder="••••••••••••" autocomplete="current-password"
            class="w-full bg-slate-800/80 border border-slate-700 rounded-xl pl-11 pr-11 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition">
          <button type="button" id="toggle-password-btn" class="absolute right-3.5 top-3 text-slate-500 hover:text-slate-300 p-1" title="Show / Hide Password">
            <i data-lucide="eye" id="eye-icon" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <!-- Action Button -->
      <button type="submit" id="login-submit-btn" class="w-full mt-2 py-3.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs uppercase tracking-wider transition transform active:scale-95 shadow-lg shadow-blue-600/30 flex items-center justify-center gap-2">
        <span>Sign In to Dashboard</span>
        <i data-lucide="arrow-right" class="w-4 h-4"></i>
      </button>

    </form>

    <!-- Default Credentials Hint for Pair-Programming/Owner -->
    <div class="mt-6 p-3.5 rounded-xl bg-slate-800/50 border border-slate-700/50 text-[11px] text-slate-400 space-y-1">
      <div class="flex items-center gap-1.5 font-bold text-slate-300">
        <i data-lucide="key" class="w-3.5 h-3.5 text-amber-400"></i>
        <span>Default Credentials:</span>
      </div>
      <p class="font-mono text-slate-300 pl-5">Username: <span class="text-white font-semibold">admin</span></p>
      <p class="font-mono text-slate-300 pl-5">Password: <span class="text-white font-semibold">mendorbit@2026</span></p>
    </div>

    <!-- Return to Website Link -->
    <div class="mt-6 text-center">
      <a href="../index.html" class="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-400 hover:text-white transition">
        <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
        <span>Return to Mendorbit Main Website</span>
      </a>
    </div>

  </div>

  <!-- Scripts -->
  <script src="js/admin-auth.js?v=1.2.7"></script>
  <script>
    if (window.lucide && window.lucide.createIcons) {
      lucide.createIcons();
    }

    // Toggle Password Visibility
    const toggleBtn = document.getElementById('toggle-password-btn');
    const pwdInput = document.getElementById('admin-password');
    const eyeIcon = document.getElementById('eye-icon');

    if (toggleBtn && pwdInput) {
      toggleBtn.addEventListener('click', () => {
        const isPassword = pwdInput.type === 'password';
        pwdInput.type = isPassword ? 'text' : 'password';
        eyeIcon.setAttribute('data-lucide', isPassword ? 'eye-off' : 'eye');
        lucide.createIcons();
      });
    }

    // Form Submit Handler
    const loginForm = document.getElementById('admin-login-form');
    const loginAlert = document.getElementById('login-alert');
    const loginAlertText = document.getElementById('login-alert-text');
    const submitBtn = document.getElementById('login-submit-btn');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginAlert.classList.add('hidden');
      
      const username = document.getElementById('admin-username').value;
      const password = document.getElementById('admin-password').value;

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span>Authenticating...</span>`;

      try {
        const res = await authenticateAdmin(username, password);
        if (res.success) {
          submitBtn.innerHTML = `<span>Redirecting...</span>`;
          const redirect = sessionStorage.getItem('mendorbit_admin_redirect') || 'index.html';
          sessionStorage.removeItem('mendorbit_admin_redirect');
          window.location.replace(redirect);
        } else {
          loginAlertText.textContent = res.message || "Invalid credentials.";
          loginAlert.classList.remove('hidden');
          submitBtn.disabled = false;
          submitBtn.innerHTML = `<span>Sign In to Dashboard</span><i data-lucide="arrow-right" class="w-4 h-4"></i>`;
          lucide.createIcons();
        }
      } catch (err) {
        loginAlertText.textContent = "Authentication system error. Please retry.";
        loginAlert.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>Sign In to Dashboard</span>`;
      }
    });
  </script>
</body>
</html>
