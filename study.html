  <script>
    let activeBatch = null;

    function isStudentEnrolled(batchId) {
      try {
        const enrolled = JSON.parse(localStorage.getItem('mendorbit_my_enrolled_batches') || '[]');
        return Array.isArray(enrolled) && enrolled.includes(batchId);
      } catch {
        return false;
      }
    }

    function initStudyRoom() {
      const urlParams = new URLSearchParams(window.location.search);
      const batchId = urlParams.get('batch') || urlParams.get('id');
      const token = urlParams.get('token');
      const order = urlParams.get('order');

      if (!batchId) {
        renderStudyError("No Batch Selected", "Please select an enrolled batch from your dashboard or browse our catalog.");
        return;
      }

      // If token & order are present from fresh checkout, ensure enrolled status is registered
      if (token && order) {
        try {
          const list = JSON.parse(localStorage.getItem('mendorbit_my_enrolled_batches') || '[]');
          if (!list.includes(batchId)) {
            list.push(batchId);
            localStorage.setItem('mendorbit_my_enrolled_batches', JSON.stringify(list));
          }
        } catch {}
      }

      // Fetch batch data
      activeBatch = getBatchById(batchId);

      if (activeBatch) {
        verifyAndRender(activeBatch, batchId);
      } else if (typeof mendorbitDB !== 'undefined' && mendorbitDB) {
        mendorbitDB.collection('mendorbit_batches').doc(batchId).get().then(doc => {
          if (doc.exists) {
            activeBatch = { ...doc.data(), id: doc.id };
            verifyAndRender(activeBatch, batchId);
          } else {
            renderStudyError("Batch Not Found", "The requested batch does not exist or has been removed.");
          }
        }).catch(() => {
          renderStudyError("Connection Error", "Unable to load classroom details. Please check your network connection.");
        });
      } else {
        renderStudyError("Batch Unavailable", "Please try again later.");
      }
    }

    function verifyAndRender(batch, batchId) {
      // Gatekeeper check: If NOT enrolled, show locked screen
      if (!isStudentEnrolled(batchId)) {
        renderLockedScreen(batch);
        return;
      }

      // Enrolled: Render full classroom
      renderClassroom(batch);
    }

    function switchClassTab(tab) {

      if (activeBtn) {
        activeBtn.classList.add('bg-blue-900', 'text-white', 'shadow-md');
        activeBtn.classList.remove('bg-slate-100', 'dark:bg-slate-800', 'text-slate-600', 'dark:text-slate-300');
      }

      ['lectures', 'notes', 'timer'].forEach(t => {
        const el = document.getElementById(`class-tab-content-${t}`);
        if (el) {
          if (t === tab) el.classList.remove('hidden');
          else el.classList.add('hidden');
        }
      });
    }

    function openLectureModal(title, url) {
      const modal = document.getElementById('lecture-player-modal');
      const titleEl = document.getElementById('modal-lecture-title');
      const iframe = document.getElementById('modal-lecture-iframe');

      if (titleEl) titleEl.textContent = title;
      if (iframe) iframe.src = url;

      modal.classList.remove('opacity-0', 'pointer-events-none');
      const dialog = modal.querySelector('div');
      if (dialog) dialog.classList.remove('scale-95');
    }

    function closeLectureModal() {
      const modal = document.getElementById('lecture-player-modal');
      const iframe = document.getElementById('modal-lecture-iframe');
      if (iframe) iframe.src = '';
      modal.classList.add('opacity-0', 'pointer-events-none');
      const dialog = modal.querySelector('div');
      if (dialog) dialog.classList.add('scale-95');
    }

    // Built-in Focus Clock
    let timerInterval = null;
    let timerSeconds = 25 * 60;
    let isTimerRunning = false;

    function toggleStudyTimer() {
      const btn = document.getElementById('study-clock-btn');
      if (isTimerRunning) {
        clearInterval(timerInterval);
        isTimerRunning = false;
        if (btn) btn.textContent = 'Resume Focus Session';
      } else {
        isTimerRunning = true;
        if (btn) btn.textContent = 'Pause Session';
        timerInterval = setInterval(() => {
          if (timerSeconds > 0) {
            timerSeconds--;
            updateTimerDisplay();
          } else {
            clearInterval(timerInterval);
            isTimerRunning = false;
            alert("Focus session complete! Take a 5-minute break.");
            resetStudyTimer();
          }
        }, 1000);
      }
    }

    function resetStudyTimer() {
      clearInterval(timerInterval);
      isTimerRunning = false;
      timerSeconds = 25 * 60;
      updateTimerDisplay();
      const btn = document.getElementById('study-clock-btn');
      if (btn) btn.textContent = 'Start Focus Session';
    }

    function updateTimerDisplay() {
      const el = document.getElementById('study-clock-display');
      if (!el) return;
      const m = Math.floor(timerSeconds / 60);
      const s = timerSeconds % 60;
      el.textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    function renderStudyError(title, desc) {
      const container = document.getElementById('study-room-container');
      container.innerHTML = `
        <div class="max-w-md mx-auto py-20 text-center space-y-4">
          <div class="w-16 h-16 rounded-2xl bg-slate-100 dark:bg-slate-800 text-slate-400 flex items-center justify-center mx-auto">
            <i data-lucide="inbox" class="w-8 h-8"></i>
          </div>
          <h2 class="text-xl font-bold text-slate-900 dark:text-white">${title}</h2>
          <p class="text-xs text-slate-500">${desc}</p>
          <a href="batches.html" class="inline-flex items-center gap-2 mt-4 px-6 py-2.5 rounded-xl bg-blue-900 text-white font-bold text-xs uppercase">
            Browse Batches
          </a>
        </div>
      `;
      if (window.lucide && window.lucide.createIcons) window.lucide.createIcons();
    }

    document.addEventListener('DOMContentLoaded', () => {
      initStudyRoom();
    });
  </script>

</body>
</html>
