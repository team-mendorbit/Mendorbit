<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="40%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>

    <!-- Accent Warm Orange / Amber -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Neon Glow -->
    <radialGradient id="glow" cx="65%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0b132b" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Background -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Technical Grid Grid Overlay -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <path d="M0 75 H1200 M0 150 H1200 M0 225 H1200 M0 300 H1200 M0 375 H1200 M0 450 H1200 M0 525 H1200 M0 600 H1200"/>
    <path d="M150 0 V675 M300 0 V675 M450 0 V675 M600 0 V675 M750 0 V675 M900 0 V675 M1050 0 V675"/>
  </g>

  <!-- Ambient Glow -->
  <circle cx="780" cy="280" r="420" fill="url(#glow)"/>

  <!-- Left Content Area -->
  <g transform="translate(80, 85)">
    <!-- Badge -->
    <rect x="0" y="0" width="280" height="38" rx="19" fill="#f97316" fill-opacity="0.18" stroke="#f97316" stroke-width="1.5"/>
    <circle cx="20" cy="19" r="6" fill="#f97316"/>
    <text x="36" y="24" fill="#fb923c" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="12" letter-spacing="1.5">CBSE CLASS 10 • OFFICIAL BYE-LAWS</text>

    <!-- Main Title -->
    <text x="0" y="95" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="44" letter-spacing="-0.5">
      <tspan x="0" dy="0">Pre-Board me Kam Marks Aaye?</tspan>
      <tspan x="0" dy="55" fill="url(#orangeGrad)">Kya Admit Card Ruk Sakta Hai?</tspan>
    </text>

    <!-- Subtitle description -->
    <text x="0" y="240" fill="#94a3b8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="500" font-size="19" letter-spacing="0.2">
      <tspan x="0" dy="0">CBSE Official Rules Breakdown • Reality Behind School Threats</tspan>
      <tspan x="0" dy="30">&amp; The Proven 60-Day Subject-Wise 90%+ Comeback Blueprint</tspan>
    </text>

    <!-- Pills Grid -->
    <g transform="translate(0, 330)">
      <!-- Rule 1 Pill -->
      <rect x="0" y="0" width="185" height="44" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
      <circle cx="22" cy="22" r="5" fill="#10b981"/>
      <text x="36" y="27" fill="#e2e8f0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="13">Admit Card Rules</text>

      <!-- Pill 2 -->
      <rect x="200" y="0" width="200" height="44" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
      <circle cx="222" cy="22" r="5" fill="#3b82f6"/>
      <text x="236" y="27" fill="#e2e8f0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="13">75% Attendance Bar</text>

      <!-- Pill 3 -->
      <rect x="415" y="0" width="195" height="44" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
      <circle cx="437" cy="22" r="5" fill="#f59e0b"/>
      <text x="451" y="27" fill="#e2e8f0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="13">60-Day Study Plan</text>
    </g>

    <!-- Bottom Brand Signature -->
    <g transform="translate(0, 440)">
      <circle cx="16" cy="16" r="16" fill="#f97316"/>
      <polygon points="11,9 24,16 11,23" fill="#ffffff"/>
      <text x="44" y="22" fill="#e2e8f0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="16">Mendorbit Education</text>
      <text x="230" y="22" fill="#64748b" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="13">• By Satyam Thakur</text>
    </g>
  </g>

  <!-- Right Visual Graphics: Educational Badge / Card -->
  <g transform="translate(790, 110)">
    <!-- Decorative Glow Backplate -->
    <rect x="-10" y="-10" width="340" height="450" rx="26" fill="#f97316" fill-opacity="0.08" stroke="#f97316" stroke-opacity="0.2" stroke-width="2"/>
    
    <!-- Glass Card -->
    <rect x="0" y="0" width="320" height="430" rx="22" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5"/>

    <!-- Card Header -->
    <rect x="0" y="0" width="320" height="60" rx="22" fill="#1e293b"/>
    <text x="25" y="36" fill="#f8fafc" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="15">CBSE Official Standing</text>
    <rect x="230" y="18" width="65" height="24" rx="6" fill="#10b981" fill-opacity="0.2"/>
    <text x="242" y="34" fill="#34d399" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="11">VERIFIED</text>

    <!-- Card Body Items -->
    <!-- Item 1 -->
    <g transform="translate(25, 85)">
      <circle cx="15" cy="15" r="15" fill="#ef4444" fill-opacity="0.15"/>
      <text x="10" y="20" fill="#ef4444" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="14">✕</text>
      <text x="40" y="14" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="13">Marks Cannot Stop Card</text>
      <text x="40" y="30" fill="#94a3b8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11">School cannot withhold for marks</text>
    </g>

    <!-- Divider -->
    <line x1="25" y1="140" x2="295" y2="140" stroke="#334155" stroke-width="1"/>

    <!-- Item 2 -->
    <g transform="translate(25, 160)">
      <circle cx="15" cy="15" r="15" fill="#10b981" fill-opacity="0.15"/>
      <text x="10" y="20" fill="#10b981" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="14">✓</text>
      <text x="40" y="14" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="13">75% Attendance Mandatory</text>
      <text x="40" y="30" fill="#94a3b8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11">Statutory criteria by Board</text>
    </g>

    <!-- Divider -->
    <line x1="25" y1="215" x2="295" y2="215" stroke="#334155" stroke-width="1"/>

    <!-- Item 3 -->
    <g transform="translate(25, 235)">
      <circle cx="15" cy="15" r="15" fill="#f59e0b" fill-opacity="0.15"/>
      <text x="10" y="20" fill="#f59e0b" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="14">⚡</text>
      <text x="40" y="14" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="13">Pre-Boards = Diagnostic</text>
      <text x="40" y="30" fill="#94a3b8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11">Designed 25% tougher deliberately</text>
    </g>

    <!-- Card Bottom CTA Box -->
    <g transform="translate(20, 315)">
      <rect x="0" y="0" width="280" height="85" rx="14" fill="#0b132b" stroke="#f97316" stroke-opacity="0.4" stroke-width="1.2"/>
      <text x="18" y="32" fill="#fb923c" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="14">Target: 90%+ in Boards</text>
      <text x="18" y="52" fill="#94a3b8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11">Follow the NCERT + PYQ daily routine</text>
      <text x="18" y="70" fill="#38bdf8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="11">mendorbit.in/blogs/strategy ➔</text>
    </g>
  </g>
</svg>
