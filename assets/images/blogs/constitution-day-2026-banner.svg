<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="glowTop" cx="82%" cy="22%" r="48%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBot" cx="18%" cy="85%" r="42%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="url(#glowTop)"/>
  <rect width="1200" height="675" fill="url(#glowBot)"/>

  <!-- Subtle Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="240" y1="0" x2="240" y2="675"/>
    <line x1="480" y1="0" x2="480" y2="675"/>
    <line x1="720" y1="0" x2="720" y2="675"/>
    <line x1="960" y1="0" x2="960" y2="675"/>
  </g>

  <!-- Subtle Tricolor Accent Top Bar -->
  <rect x="0" y="0" width="400" height="6" fill="#f97316"/>
  <rect x="400" y="0" width="400" height="6" fill="#ffffff" fill-opacity="0.9"/>
  <rect x="800" y="0" width="400" height="6" fill="#10b981"/>

  <!-- Right Side Constitution Cheat-Sheet Card -->
  <g transform="translate(765, 115)">
    <rect x="0" y="0" width="350" height="445" rx="28" fill="#0f172a" fill-opacity="0.7" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2"/>
    <rect x="28" y="30" width="175" height="30" rx="15" fill="#f97316" fill-opacity="0.18" stroke="#f97316" stroke-opacity="0.55"/>
    <text x="115" y="50" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#fdba74" letter-spacing="1.2">26 NOV 1949 → 2026</text>

    <rect x="28" y="82" width="294" height="62" rx="14" fill="#1e293b" fill-opacity="0.85"/>
    <text x="46" y="107" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1.2">PREAMBLE ESSENTIALS</text>
    <text x="46" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="800" fill="#ffffff">42nd Amendment &amp; Basic Structure</text>

    <rect x="28" y="160" width="294" height="62" rx="14" fill="#1e293b" fill-opacity="0.85"/>
    <text x="46" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1.2">MOST REPEATED ARTICLES</text>
    <text x="46" y="208" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="800" fill="#fbbf24">Art 14, 19, 21, 32, 226 &amp; 352–360</text>

    <rect x="28" y="238" width="294" height="62" rx="14" fill="#1e293b" fill-opacity="0.85"/>
    <text x="46" y="263" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1.2">TOP AMENDMENTS</text>
    <text x="46" y="286" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="800" fill="#6ee7b7">42nd, 44th, 61st, 73rd, 86th, 106th</text>

    <rect x="28" y="328" width="294" height="80" rx="18" fill="url(#saffronGrad)"/>
    <text x="175" y="365" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" fill="#0f172a" letter-spacing="0.5">CLAT 2027 &amp; SSC</text>
    <text x="175" y="389" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#1e293b">10-Minute Revision Cheat-Sheet</text>
  </g>

  <!-- Left Side Editorial Typography -->
  <g transform="translate(82, 110)">
    <rect x="0" y="0" width="275" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2"/>
    <circle cx="24" cy="20" r="8" fill="#10b981"/>
    <text x="44" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#ffffff" letter-spacing="1.8">SAMVIDHAN DIVAS 2026</text>

    <text x="0" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="68" font-weight="900" fill="#ffffff" letter-spacing="-1.5">CONSTITUTION</text>
    <text x="0" y="204" font-family="system-ui, -apple-system, sans-serif" font-size="68" font-weight="900" fill="url(#saffronGrad)" letter-spacing="-1.5">DAY 2026</text>

    <rect x="0" y="234" width="130" height="7" rx="3.5" fill="url(#greenGrad)"/>

    <text x="0" y="288" font-family="system-ui, -apple-system, sans-serif" font-size="27" font-weight="700" fill="#e2e8f0">15 Most Repeated Articles,</text>
    <text x="0" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="27" font-weight="700" fill="#e2e8f0">Preamble &amp; Top Amendments</text>
    <text x="0" y="362" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="500" fill="#94a3b8">77th Anniversary • 26 November 2026</text>

    <rect x="0" y="400" width="335" height="50" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="22" y="431" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="800" fill="#fdba74">MENDORBIT • LAW &amp; POLITY</text>
  </g>
</svg>
