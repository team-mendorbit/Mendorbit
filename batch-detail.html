<!DOCTYPE html>

  <!-- Tailwind CSS CDN with Dark Mode Config -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              blue: '#1e3a8a',
              blueDark: '#0f172a',
              orange: '#f97316',
              orangeDark: '#ea580c',
              emerald: '#10b981',
            }
          }
        }
      }
    }
  </script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/css/style.css?v=1.2.7">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 flex flex-col min-h-screen">

  <!-- Header / Navigation -->
  <header class="sticky top-0 z-50 nav-glass border-b border-slate-200 dark:border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-20">
        
        <!-- Logo -->
        <a href="index.html" class="flex items-center gap-3 group">
          <img src="assets/images/logo/logo.png?v=1.1.0" alt="Mendorbit Logo" class="w-10 sm:w-12 h-10 sm:h-12 object-contain drop-shadow-md transition transform group-hover:scale-105">
          <div>
            <span class="text-xl sm:text-2xl font-black tracking-tight gradient-orange font-sans">Mendorbit</span>
            <p class="text-[9px] sm:text-[10px] uppercase font-bold tracking-widest text-slate-500 dark:text-slate-400 -mt-1">Orbit of Knowledge</p>
          </div>
        </a>

        <!-- Desktop Navigation Links -->
        <nav class="hidden md:flex items-center gap-6 lg:gap-8 font-semibold text-sm text-slate-700 dark:text-slate-200">
          <a href="index.html" class="hover:text-blue-900 dark:hover:text-blue-400 transition">Home</a>
          <a href="batches.html" class="text-blue-900 dark:text-blue-400 font-bold border-b-2 border-blue-900 dark:border-blue-400 pb-0.5">Batches</a>
          <a href="notes.html" class="hover:text-blue-900 dark:hover:text-blue-400 transition">Notes</a>
          <a href="blog.html" class="hover:text-blue-900 dark:hover:text-blue-400 transition">Blogs</a>
          <a href="about.html" class="hover:text-blue-900 dark:hover:text-blue-400 transition">Mission</a>
          <a href="contact.html" class="hover:text-blue-900 dark:hover:text-blue-400 transition">Contact</a>
        </nav>

        <!-- Right Action Items -->
        <div class="hidden lg:flex items-center gap-3 xl:gap-4">
          <a href="https://www.youtube.com/@mendorbit?sub_confirmation=1" target="_blank" class="inline-flex items-center gap-2 bg-[#0f0f0f] hover:bg-[#272727] text-white px-4 py-2.5 rounded-full font-bold text-xs uppercase tracking-wider transition transform active:scale-95 shadow-md group">
            <svg class="w-4 h-4 text-[#ff0000] fill-current" viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
            <span>Subscribe</span>
          </a>

          <a href="batches.html" class="btn-premium-batches inline-flex items-center gap-2 px-5 py-2.5 font-bold text-xs uppercase tracking-wider shadow-md transform active:scale-95">
            <span>Explore Batches</span>
            <i data-lucide="sparkles" class="w-4 h-4 text-amber-300"></i>
          </a>

          <!-- Elegant Vertical Divider -->
          <div class="h-6 w-px bg-slate-200 dark:bg-slate-800 mx-1"></div>

          <!-- Extreme Right Controls -->
          <div class="flex items-center gap-2.5">
            <button type="button" aria-label="Toggle Dark and Light Mode" class="apple-theme-toggle">
              <span class="apple-theme-thumb">
                <i data-lucide="sun" data-theme-icon="sun" class="w-3.5 h-3.5 text-amber-500"></i>
                <i data-lucide="moon" data-theme-icon="moon" class="w-3.5 h-3.5 text-indigo-400 hidden"></i>
              </span>
            </button>

            <!-- Notification Bell -->
            <div class="relative notification-wrapper">
              <button type="button" aria-label="Notifications" class="notification-bell-btn" title="Notifications">
                <i data-lucide="bell" class="w-4 h-4"></i>
                <span class="notification-badge-pill hidden">0</span>
              </button>
              <div class="notification-dropdown-panel hidden">
                <div class="flex items-center justify-between px-4 py-3 border-b border-slate-100 dark:border-slate-800">
                  <span class="font-bold text-xs text-slate-900 dark:text-white uppercase tracking-wider">Notifications</span>
                  <button type="button" class="mark-all-read-btn text-[11px] font-semibold text-blue-900 dark:text-blue-400 hover:underline">Mark all as read</button>
                </div>
                <div class="notification-dropdown-list max-h-80 overflow-y-auto divide-y divide-slate-100 dark:divide-slate-800/60"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Mobile Controls -->
        <div class="md:hidden flex items-center gap-2">
          <div class="relative notification-wrapper">
            <button type="button" aria-label="Notifications" class="notification-bell-btn" title="Notifications">
              <i data-lucide="bell" class="w-4 h-4"></i>
              <span class="notification-badge-pill hidden">0</span>
            </button>
          </div>
          <button type="button" aria-label="Toggle Dark and Light Mode" class="apple-theme-toggle">
            <span class="apple-theme-thumb">
              <i data-lucide="sun" data-theme-icon="sun" class="w-3.5 h-3.5 text-amber-500"></i>
              <i data-lucide="moon" data-theme-icon="moon" class="w-3.5 h-3.5 text-indigo-400 hidden"></i>
            </span>
          </button>
          <button id="mobile-menu-btn" class="p-2 text-slate-700 dark:text-slate-200">
            <i data-lucide="menu" class="w-7 h-7"></i>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Batch Detail Dynamic View -->
  <main class="flex-1 py-10 sm:py-14">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      
      <!-- Back Navigation Breadcrumb -->
      <div class="mb-6">
        <a href="index.html#batches-section" class="inline-flex items-center gap-2 text-sm font-bold text-slate-600 dark:text-slate-400 hover:text-blue-900 dark:hover:text-blue-400 transition">
          <i data-lucide="arrow-left" class="w-4 h-4"></i>
          <span>Back to All Batches</span>
        </a>
      </div>

      <!-- Container Populated Dynamically by JS -->
      <div id="batch-detail-root" class="space-y-10">
        <!-- Loading State Skeleton -->
        <div class="animate-pulse space-y-6">
          <div class="h-64 bg-slate-200 dark:bg-slate-800 rounded-3xl"></div>
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-8 h-96 bg-slate-200 dark:bg-slate-800 rounded-3xl"></div>
            <div class="lg:col-span-4 h-96 bg-slate-200 dark:bg-slate-800 rounded-3xl"></div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-slate-900 text-white pt-16 pb-12 border-t border-slate-800 mt-auto">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="pt-8 flex flex-col sm:flex-row items-center justify-between text-xs text-slate-500 gap-4 text-center sm:text-left">
        <div>
          <p>© 2026 Mendorbit. All rights reserved. • <span class="text-slate-400 font-mono">Version <span class="app-version-display text-slate-300 font-semibold">v1.2.7</span></span></p>
          <p class="font-semibold text-slate-400 mt-1">"हम टॉपर्स नहीं चुनते, हम टॉपर्स बनाते हैं!"</p>
        </div>
      </div>
    </div>
  </footer>

  <!-- Firebase Cloud SDKs & Mendorbit Cloud Engine -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics-compat.js"></script>
  <script src="assets/js/firebase-init.js?v=1.3.1"></script>

  <!-- Scripts -->
  <script src="assets/js/batches-data.js?v=1.3.1"></script>
  <script src="assets/js/main.js?v=1.3.1"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const batchId = urlParams.get('id') || 'class-10-aarambh';
      const batch = getBatchById(batchId) || getBatchesList()[0];
      const root = document.getElementById('batch-detail-root');

      if (!batch) {
        root.innerHTML = `
          <div class="text-center py-20">
            <h2 class="text-2xl font-bold">Batch Not Found</h2>
            <a href="index.html#batches-section" class="inline-block mt-4 text-blue-600 font-bold">Return to Batches</a>
          </div>
        `;
        return;
      }

      document.title = `${batch.title} — Mendorbit`;

      root.innerHTML = `
        <!-- Hero Header Card of the Batch -->
        <div class="relative rounded-3xl bg-gradient-to-tr ${batch.bannerGradient} text-white p-6 sm:p-10 shadow-2xl overflow-hidden">
          <div class="relative z-10 max-w-3xl space-y-4">
            <div class="flex flex-wrap items-center gap-2">
              <span class="px-3 py-1 rounded-full text-xs font-black uppercase tracking-wider bg-white/20 backdrop-blur-md text-amber-300 border border-white/10">
                ${batch.streamTag}
              </span>
              <span class="px-2.5 py-0.5 rounded-md text-xs font-bold uppercase bg-black/30 border border-white/20">
                ${batch.language || 'HINGLISH'}
              </span>
              <span class="px-3 py-1 rounded-full text-xs font-black uppercase tracking-wider bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                ${batch.discountBadge}
              </span>
            </div>

            <h1 class="text-3xl sm:text-4xl lg:text-5xl font-black text-white tracking-tight leading-tight">
              ${batch.title}
            </h1>

            <p class="text-sm sm:text-base text-slate-200 font-medium leading-relaxed">
              ${batch.description}
            </p>

            <div class="flex flex-wrap items-center gap-4 pt-2 text-xs sm:text-sm text-slate-300 font-semibold">
              <span class="inline-flex items-center gap-1.5"><i data-lucide="book-open" class="w-4 h-4 text-amber-400"></i> ${batch.targetAudience}</span>
              <span class="inline-flex items-center gap-1.5"><i data-lucide="calendar" class="w-4 h-4 text-amber-400"></i> ${batch.schedule}</span>
            </div>
          </div>
        </div>

        <!-- 2-Column Detail Layout -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
          
          <!-- Left Main Column: Syllabus, Features & FAQs -->
          <div class="lg:col-span-8 space-y-8">
            
            <!-- Curriculum Section -->
            <div class="rounded-3xl bg-white dark:bg-slate-900 border border-slate-200/90 dark:border-slate-800 p-6 sm:p-8 shadow-sm space-y-6">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-blue-100 dark:bg-blue-950 text-blue-900 dark:text-blue-400 flex items-center justify-center font-bold">
                  <i data-lucide="book-open-check" class="w-5 h-5"></i>
                </div>
                <div>
                  <h3 class="text-xl font-black text-slate-900 dark:text-white">Curriculum & Subjects Breakdown</h3>
                  <p class="text-xs text-slate-500 dark:text-slate-400">Complete root-level conceptual coverage line-by-line</p>
                </div>
              </div>

              <div class="divide-y divide-slate-100 dark:divide-slate-800">
                ${batch.curriculum ? batch.curriculum.map(c => `
                  <div class="py-4 first:pt-0 last:pb-0 space-y-1.5">
                    <h4 class="text-base font-bold text-slate-900 dark:text-white flex items-center gap-2">
                      <span class="w-2 h-2 rounded-full bg-blue-600"></span>
                      <span>${c.subject}</span>
                    </h4>
                    <p class="text-xs sm:text-sm text-slate-600 dark:text-slate-300 leading-relaxed pl-4">
                      ${c.topics}
                    </p>
                  </div>
                `).join('') : '<p class="text-sm text-slate-500">Comprehensive syllabus covered from basics.</p>'}
              </div>
            </div>

            <!-- Key Features & Methodology -->
            <div class="rounded-3xl bg-white dark:bg-slate-900 border border-slate-200/90 dark:border-slate-800 p-6 sm:p-8 shadow-sm space-y-6">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-orange-100 dark:bg-orange-950 text-orange-600 dark:text-orange-400 flex items-center justify-center font-bold">
                  <i data-lucide="zap" class="w-5 h-5"></i>
                </div>
                <div>
                  <h3 class="text-xl font-black text-slate-900 dark:text-white">What You Get Inside This Batch</h3>
                  <p class="text-xs text-slate-500 dark:text-slate-400">Everything needed to transition from weak to top ranker</p>
                </div>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                ${batch.features ? batch.features.map(f => `
                  <div class="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-100 dark:border-slate-800 flex items-start gap-3">
                    <i data-lucide="check-circle-2" class="w-5 h-5 text-emerald-500 flex-shrink-0 mt-0.5"></i>
                    <span class="text-xs sm:text-sm font-semibold text-slate-800 dark:text-slate-200 leading-relaxed">${f}</span>
                  </div>
                `).join('') : ''}
              </div>
            </div>

          </div>

          <!-- Right Sidebar: Pricing & Action Box -->
          <div class="lg:col-span-4 space-y-6 lg:sticky lg:top-28">
            <div class="rounded-3xl bg-white dark:bg-slate-900 border border-slate-200/90 dark:border-slate-800 p-6 sm:p-8 shadow-xl space-y-6">
              <div>
                <span class="text-xs font-bold uppercase text-slate-500 dark:text-slate-400">Investment in Your Future</span>
                <div class="flex items-baseline gap-2 mt-1">
                  <span class="text-3xl sm:text-4xl font-black text-slate-900 dark:text-white">${batch.price}</span>
                  ${batch.originalPrice ? `<span class="line-through text-base font-semibold text-slate-400">${batch.originalPrice}</span>` : ''}
                </div>
                <span class="inline-block mt-1 text-xs font-black text-emerald-600 dark:text-emerald-400 uppercase tracking-wider bg-emerald-50 dark:bg-emerald-950/60 px-2.5 py-0.5 rounded-md border border-emerald-200/60 dark:border-emerald-900/40">
                  ${batch.discountBadge}
                </span>
              </div>

              <div class="space-y-3 pt-2">
                <button type="button" onclick="handleBatchBuyClick('${batch.id}', '${batch.title.replace(/'/g, "\\'")}', '${batch.price}', '${batch.enrollLink}')" class="w-full inline-flex items-center justify-center gap-2 py-4 px-6 rounded-2xl bg-gradient-to-r from-blue-900 to-slate-900 hover:from-blue-800 hover:to-slate-800 text-white font-extrabold text-sm uppercase tracking-wider transition shadow-lg transform active:scale-95">
                  <span>Buy Now</span>
                  <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
                <p class="text-[11px] text-center text-slate-500 dark:text-slate-400">
                  ⚡ Instant access to live video lectures, doubt solving & chapter PDF notes.
                </p>
              </div>

              <!-- Quick Info Badges -->
              <div class="pt-4 border-t border-slate-100 dark:border-slate-800 space-y-3 text-xs font-medium text-slate-700 dark:text-slate-300">
                <div class="flex items-center justify-between">
                  <span class="text-slate-500">Medium</span>
                  <span class="font-bold">${batch.language || 'Hinglish'}</span>
                </div>
                <div class="flex items-center justify-between">
                  <span class="text-slate-500">Platform</span>
                  <span class="font-bold text-red-600 flex items-center gap-1"><i data-lucide="youtube" class="w-3.5 h-3.5"></i> YouTube Live</span>
                </div>
                <div class="flex items-center justify-between">
                  <span class="text-slate-500">Doubt Support</span>
                  <span class="font-bold text-emerald-600">Included (Live)</span>
                </div>
                <div class="flex items-center justify-between">
                  <span class="text-slate-500">Lecture Notes</span>
                  <span class="font-bold text-blue-600">Free PDF Downloads</span>
                </div>
              </div>

            </div>
          </div>

        </div>
      `;

      if (window.lucide && window.lucide.createIcons) {
        window.lucide.createIcons();
      }
    });
  </script>
</body>
</html>
